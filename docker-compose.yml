version: '3.8'

services:
  app:
    build: .
    container_name: aphelion-backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - aphelion-net

  caddy:
    image: caddy:2-alpine
    container_name: aphelion-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./pay:/app/pay:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - aphelion-net

volumes:
  caddy-data:
  caddy-config:

networks:
  aphelion-net:
    driver: bridge
